<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161922">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Offline rail interface and on-device media viewer.">
  <title>Wayline</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="phone">
    <main id="main" class="screen">
      <span id="offline-status" class="sr-only" role="status" hidden>Offline ready</span>

      <section id="booking" aria-labelledby="booking-heading">
        <h1 class="sr-only" id="booking-heading">Booking</h1>
        <img class="reference-image" src="./booking-form.png" width="1170" height="1367" alt="Single journey from Kassel to Berlin. Today, 01:02. One passenger, second class, D-Ticket. D-Ticket services only. Fastest connections inactive. Search. Do you have a Deutschland-Ticket?">
        <img class="reference-image" src="./booking-details.png" width="1170" height="2001" alt="My favourites. My association, Berlin and Brandenburg. Tickets and offers, Deutschland-Ticket. Info and tips, Interrail.">
      </section>

      <section id="journeys" aria-labelledby="journeys-heading" hidden>
        <div id="journeys-list">
          <div class="reference">
            <h1 class="sr-only" id="journeys-heading">Journeys</h1>
            <img class="reference-image" src="./journeys-header.png" width="1170" height="176" alt="Updated 3 mins ago">
            <button class="reference-hit add-video" id="add-video" type="button" aria-label="Add video"></button>
          </div>

          <div class="reference" id="journeys-empty">
            <img class="reference-image" src="./journeys-empty.png" width="1170" height="930" alt="No trips exist. No tickets have been purchased or trips bookmarked.">
            <button class="reference-hit refresh" id="refresh" type="button" aria-label="Refresh"></button>
            <span id="refresh-status" class="sr-only" role="status"></span>
          </div>

          <button class="ticket-card" id="open-video" type="button" hidden>
            <span>Deutschland Ticket</span>
          </button>

          <img class="reference-image" src="./journeys-previous.png" width="1170" height="520" alt="Previous trips. Previous and cancelled journeys, BahnCards, season tickets and subscriptions.">
        </div>

      </section>

      <section id="profile" aria-labelledby="profile-heading" hidden>
        <h1 class="sr-only" id="profile-heading">Profile</h1>
        <div class="reference">
          <img class="reference-image" src="./profile-reference.png" width="1170" height="1927" alt="Personal details. Login and security. Means of payment, Book faster. Subscriptions and credits.">
          <button class="reference-hit personal-more" id="edit-profile" type="button" aria-label="More personal details"></button>
          <button class="reference-hit personal-card" id="open-profile" type="button" aria-describedby="photo-card-action" aria-disabled="true">
            <strong id="display-name">Mr Alex Morgan</strong>
            <span>Customer ID 0000 0000 0000</span>
          </button>
          <span class="sr-only" id="photo-card-action">Opens the saved profile photo</span>
          <p class="demo-email">passenger@example.com</p>
        </div>
        <div class="subscription-row">
          <article class="subscription-card" aria-labelledby="subscription-heading">
            <svg viewBox="0 0 280 220" aria-hidden="true">
              <path d="M34 23h183a24 24 0 0 1 24 24v65a8 8 0 0 0 0 16v48a23 23 0 0 1-23 23H33a24 24 0 0 1-24-24v-47a8 8 0 0 0 0-16V47a24 24 0 0 1 25-24Z"/>
              <path d="M41 59h72m-72 24h96m-96 68h24m17 0h90m-131 22h72" />
              <path class="subscription-perforation" d="M32 116h186" />
              <path d="M187 53h10v10h-10zm21 0h10v10h-10zm-21 21h10v10h-10zm22 0h8v8m-1 0h5" />
              <circle class="subscription-badge" cx="230" cy="171" r="43" />
              <path class="subscription-accent" d="M221 157h-5a10 10 0 0 0 0 20h8m13-20h6a10 10 0 1 1 0 20h-8m-14-10h18"/>
            </svg>
            <div>
              <h2 id="subscription-heading">Subscriptions</h2>
              <p>Manage your subscriptions<br>and their details.</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <nav class="dock" aria-label="Main navigation" data-active="booking">
      <img class="dock-art" data-dock="booking" src="./dock-booking.png" width="1046" height="190" alt="">
      <img class="dock-art" data-dock="journeys" src="./dock-journeys.png" width="1046" height="190" alt="">
      <img class="dock-art" data-dock="profile" src="./dock-profile.png" width="1046" height="190" alt="">
      <button type="button" data-page="booking" aria-controls="booking" aria-current="page"><span class="sr-only">Booking</span></button>
      <button type="button" disabled><span class="sr-only">Nearby</span></button>
      <button type="button" data-page="journeys" aria-controls="journeys"><span class="sr-only">Journeys</span></button>
      <button type="button" data-page="profile" aria-controls="profile"><span class="sr-only">Profile</span></button>
    </nav>

    <dialog class="fullscreen-viewer" id="video-view" aria-label="Deutschland Ticket">
      <video id="local-video" playsinline muted loop disablepictureinpicture disableremoteplayback aria-label="Selected local video"></video>
      <button class="back-button" id="back-to-journeys" type="button" aria-label="Back to Journeys">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg>
      </button>
      <p id="video-error" class="feedback video-error" role="alert" hidden></p>
    </dialog>

    <dialog class="fullscreen-viewer" id="photo-viewer" aria-labelledby="photo-viewer-label">
      <span class="sr-only" id="photo-viewer-label">Saved profile photo. Swipe right or down to close.</span>
      <img id="fullscreen-photo" alt="Saved profile photo" draggable="false">
    </dialog>

    <dialog id="video-dialog" aria-labelledby="video-dialog-title">
      <div class="dialog-heading">
        <h2 id="video-dialog-title">Add a local video</h2>
        <form method="dialog"><button class="icon-button" type="submit" aria-label="Close">×</button></form>
      </div>
      <p class="dialog-copy">Select a video from Photos or Files.</p>
      <button class="button" id="pick-video" type="button"><span aria-hidden="true">+</span> Choose video</button>
      <input id="video-file" type="file" accept="video/*,.mov,.mp4,.m4v" hidden>
      <p id="video-pick-error" class="feedback" role="alert" hidden></p>
    </dialog>

    <dialog id="profile-dialog" aria-labelledby="profile-dialog-title">
      <div class="dialog-heading">
        <h2 id="profile-dialog-title">Personal details</h2>
        <form method="dialog"><button class="icon-button" type="submit" aria-label="Close">×</button></form>
      </div>
      <div class="profile-photo">
        <img id="saved-photo" alt="Saved profile photo" hidden>
        <svg id="empty-photo" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="9" cy="9" r="1.5"/>
          <path d="m3 18 5-4 3 2 5-5 5 5"/>
        </svg>
      </div>
      <button class="button photo-button" id="pick-photo" type="button"><span aria-hidden="true">+</span> <span data-photo-label>Add photo</span></button>
      <input id="photo-file" type="file" accept="image/*" hidden>
      <p id="photo-status" class="feedback" role="status" hidden></p>
      <form class="name-form" id="name-form">
        <label for="name">Name</label>
        <div><input id="name" type="text" autocomplete="name" maxlength="100" placeholder="Your name" required><button class="button" type="submit">Save name</button></div>
        <p id="name-status" class="feedback" role="status" hidden></p>
      </form>
    </dialog>
  </div>
</body>
</html>
